function makeNew(name,place,policy){S={v:4,recruitmentInterval:240,sect:sectTitle(place),leader:{name,ageMonths:240,realm:0,dynasty:1,stats:{내공:15,근력:13,민첩:14,체력:13,통찰:12}},useLineage:null,lineage:{},totalMonths:0,cycleMonths:0,gold:4500,scrolls:35,scrollPart:0,stones:12,herbs:0,pills:0,policy,allowPolicy:false,unrest:0,align:0,fame:0,manuals:{'0-0':1,'0-1':1},buildings:{hall:1,yard:1,books:1,money:1,heal:1,dorm:1},members:[],elders:[],nextId:1,heirId:null,party:[],history:[],lastMission:-1,investments:[],pending:null,gameOver:false,crisis:null,healHistory:[],yearlySeed:0};log(S.sect+' 창설. 초대 장문인 '+name+' 취임.','창설');save();render();}

function load(){try{const value=JSON.parse(localStorage.getItem(KEY)||'null');if(value?.v!==4||!Array.isArray(value.members))return false;S=value;let repaired=false;if(typeof S.sect==='string'&&Array.from(S.sect).length===2&&S.sect.endsWith('파')){S.sect=Array.from(S.sect)[0]+'산파';repaired=true;}
 if(S.recruitmentInterval!==240){
  for(const d of S.members){
   const original=Math.floor((Number(d.joinMonth)||0)/240)+1;
   const operational=clamp(original-S.leader.dynasty+1,1,3);
   if(d.origin!==original||d.gen!==operational){d.origin=original;d.gen=operational;repaired=true;}

function recruitBlocked(g){if(S.gameOver)return '문파 운영이 종료되었습니다.';if(S.crisis)return '내분부터 해결해야 합니다.';if(inBan())return '18~20년 차는 제자 모집 금지 기간입니다.';if(byGen(g).length>=cap())return `현재 숙소의 ${absoluteRecruitmentGeneration()}대 제자 정원(${cap()}명)이 가득 찼습니다.`;return '';}
function makeCandidate(gen){const tall=weightedIndex(rates());const years=rand(15,28);const realm=weightedIndex([82,15,3].slice(0,realmCap()+1));const origin=absoluteRecruitmentGeneration();const traits={};const caps={};const base=6+realm*16+Math.floor((years-15)*.5);for(const stat of STATS){traits[stat]=clamp(rand(base-5,base+6),1,99);caps[stat]=clamp(rand(43,75)+(tall-2)*5-Math.floor((years-15)*.65),traits[stat],99);}
 return {id:S.nextId++,name:randName(origin,S.useLineage),gen,origin,ageMonths:years*12+rand(0,11),talent:tall,realm,stats:traits,limits:caps,master:gen===1?S.leader.name:byGen(gen-1).find(d=>age(d)>=21)?.name||S.leader.name,joinMonth:S.totalMonths,joinOrder:S.nextId,honors:[],heirMonths:0,equipped:null,fatigue:0,injury:0};
}
function startRecruit(count){const gen=recruitmentGeneration();const error=recruitBlocked(gen);if(error){note(error);return;}const allowed= count===50?S.buildings.books>=6:count===100?S.buildings.books>=8:true;if(!allowed){note('비급각 증축이 필요합니다.');return;}const unit=35;const cost=count*unit;if(S.gold<cost){note(`모집 비용 ${fmt(cost)}금이 부족합니다.`);return;}if(S.useLineage===null){showDialog('작명 방식 선택','<p>첫 제자 모집 시 단 한 번 결정하며 이후 변경할 수 없습니다.</p><div class="field"><label class="field-label" for="lineageSelect">제자 작명 규칙</label><select id="lineageSelect"><option value="yes">항렬자 사용 (성씨 없음)</option><option value="no">항렬자 미사용 (무협식 무작위 성명)</option></select></div><p class="helper">항렬자 사용 시 2글자 90% / 3글자 10%, 직전 3개 항렬과 발음 중복을 금지합니다.</p><div class="btn-row"><button type="button" class="btn" data-dialog="close">취소</button><button type="button" class="btn primary" data-dialog="lineageConfirm" data-count="'+count+'">작명 방식 확정</button></div>');return;}
 S.gold-=cost;S.pending={gen,origin:absoluteRecruitmentGeneration(),count,candidates:[]};const arr=S.pending.candidates;for(let i=0;i<count;i++)arr.push(makeCandidate(gen));save();showCandidates();}
function showCandidates(){const p=S.pending;if(!p)return;const sorted=[...p.candidates].sort((a,b)=>b.talent-a.talent||b.realm-a.realm||avg(b)-avg(a));const html='<p class="helper">'+p.count+'회 추첨 · <strong>'+p.origin+'대 제자</strong>로 자동 배정. 이 중 <strong>1명만 입문</strong>시킬 수 있습니다. 포기하면 비용은 반환되지 않습니다.</p><p class="talent-guide"><strong>자질 순위 (낮음 → 높음)</strong><span>'+esc(TALENT_ORDER)+'</span></p><div class="choices">'+sorted.map(d=>'<button type="button" class="choice" data-dialog="admit" data-id="'+d.id+'"><strong>'+esc(d.name)+' · '+TALENTS[d.talent].name+' ('+(d.talent+1)+'/7) · '+REALMS[d.realm]+'</strong><span>'+age(d)+'세 · 평균 '+avg(d).toFixed(1)+' · 내공 '+d.stats.내공+'</span></button>').join('')+'</div><button type="button" class="btn wide" data-dialog="discard">모집 결과 포기</button>';showDialog('제자 모집 결과',html,false);}
function admit(id){const p=S.pending;if(!p)return;const d=p.candidates.find(a=>a.id===Number(id));if(!d){note('선택한 제자를 찾지 못했습니다.');return;}const error=recruitBlocked(p.gen);if(error){note(error);return;}S.members.push(d);S.pending=null;refreshTitles();if(age(d)>=21&&S.party.length<5)S.party.push(d.id);if(!S.heirId&&d.gen===1&&hall()>=4)S.heirId=d.id;log(d.name+' 입문 · '+d.origin+'대 제자 · '+TALENTS[d.talent].name,'입문');closeDialog();update(d.name+'이(가) '+d.origin+'대 제자로 입문했습니다.');}
function grow(d){const t=TALENTS[d.talent];const ageFactor=age(d)<=20?1.14:age(d)<=28?1:age(d)<=40?.9:age(d)<=55?.76:.55;const factor=t.growth*ageFactor*gymGrowth()*dormGrowth()*activePolicy().train*(1-d.fatigue/300);const increment=.053*factor;
 for(const k of STATS){if(d.stats[k]<d.limits[k])d.stats[k]=Math.min(d.limits[k],Math.round((d.stats[k]+increment)*1000)/1000);}}
function incomeInvestment(x){if(S.totalMonths<x.start+x.delay)return 0;const type=INVEST.find(y=>y.name===x.name);if(!type)return 0;let earned=Math.max(0,Math.round(type.base+rand(-type.spread,type.spread)));
 if(type.name==='표국'&&Math.random()<.12)earned=0;
 if(type.name==='상단'&&Math.random()<.045)earned*=3;
 if(type.name==='약전'&&Math.random()<.08){S.herbs++;log('약전에서 영약 1개를 획득했습니다.','투자');}
 return earned;
}
function nextMonth(){if(S.gameOver||S.crisis)return false;const beforeBan=inBan();S.totalMonths++;S.cycleMonths++;S.leader.ageMonths++;
 const monthIncome=Math.round(38*activePolicy().money*(1+(S.buildings.money-1)*.07));const upkeep=S.members.length*2+S.elders.length*3;S.gold+=monthIncome-upkeep;
 const returns=S.investments.reduce((sum,a)=>sum+incomeInvestment(a),0);S.gold+=returns;
 S.scrollPart+=.14*activePolicy().scroll;while(S.scrollPart>=1){S.scrolls++;S.scrollPart--;}
 for(const d of S.members){d.ageMonths++;grow(d);d.fatigue=Math.max(0,d.fatigue-dormRecover());if(d.injury>0&&S.buildings.heal>=2&&Math.random()<.10+S.buildings.heal*.03)d.injury--;if(head(1)?.id===d.id&&hall()>=3)d.heirMonths++;}
 for(const d of S.elders){d.ageMonths++;}
 S.unrest=clamp(S.unrest-.12,0,100);
 if(S.totalMonths%12===0)log(`문파력 ${Math.floor(S.totalMonths/12)+1}년, 월간 재정과 수련을 점검했습니다.`,'경영');
 if(!beforeBan&&inBan())log('18년 차 진입. 제자 모집 중단, 장문인 세대교체 기간 시작.','계승');
 if(age(S.leader)>=65){const chance=Math.max(0,(age(S.leader)-64)*.00035);if(Math.random()<chance){log(S.leader.name+' 장문인이 세상을 떠났습니다.','사건');if(hall()<4){S.gameOver=true;log('장문인전 4단계 미달로 문파가 멸망했습니다.','멸망');return false;}return succession(true);}}
 if(S.cycleMonths>=240)return succession(true);
 if(S.unrest>55&&S.elders.length>0&&Math.random()<(S.unrest-55)*.0005){S.crisis=true;log('문파 내부에서 장문인 교체를 요구하는 반란이 발생했습니다.','내분');return false;}
 return true;
}
function advance(n){if(S.gameOver){note('문파가 멸망했습니다. 새 게임을 시작하십시오.');return;}if(S.crisis){note('내분을 먼저 해결하십시오.');return;}let processed=0;for(let i=0;i<n;i++){processed++;if(!nextMonth())break;}update(`${processed}개월 진행했습니다.`);if(S.allowPolicy)policyModal();}
function succession(auto){if(!auto&&!inBan()){note('18~20년 차에만 장문인 승계가 가능합니다.');return false;}if(hall()<4){if(auto){S.gameOver=true;log('장문인전 4단계 미달로 계승에 실패했습니다. 문파 멸망.','멸망');}else note('장문인전 4단계를 건설해야 승계할 수 있습니다.');return false;}
 let heir=findDisc(S.heirId);if(!heir||heir.gen!==1){heir=head(1);if(!heir){S.gameOver=true;log('후계자가 없어 문파가 멸망했습니다.','멸망');return false;}}
 const score=legitimacy(heir);const former=S.leader;const other=byGen(1).filter(d=>d.id!==heir.id);
 S.elders.push({id:'leader-'+former.dynasty,name:former.name,ageMonths:former.ageMonths,role:'전대 장문인'});
 for(const d of other)S.elders.push({id:'elder-'+d.id,name:d.name,ageMonths:d.ageMonths,role:'장로'});
 S.members=S.members.filter(d=>d.gen!==1);for(const d of S.members)d.gen--;

 S.heirId=head(1)?.id||null;S.party=S.party.filter(id=>!!findDisc(id));S.cycleMonths=0;S.unrest=clamp(S.unrest+(100-score)*.55,0,100);S.allowPolicy=hall()>=5;refreshTitles();
 log(`${heir.name} ${S.leader.dynasty}대 장문인 취임 · 계승 명분 ${score}점`,'계승');if(score<60)log('계승 명분이 부족해 장로와 제자들의 불만이 높아졌습니다.','내분');return false;
}
function upgrade(id){const spec=BLD.find(x=>x.id===id);if(!spec||S.gameOver)return;const curr=S.buildings[id];if(curr>=9){note('최고 단계 시설입니다.');return;}if(id!=='hall'&&curr>=hall()){note('장문인전보다 높은 단계로 증축할 수 없습니다.');return;}
 const cost=Math.round(140*Math.pow(curr+1,1.9)*(id==='hall'?1.35:1));if(S.gold<cost){note(`증축에 ${fmt(cost)}금이 필요합니다.`);return;}
 S.gold-=cost;S.buildings[id]++;if(id==='hall'&&hall()>=4&&!S.heirId&&head(1))S.heirId=head(1).id;refreshTitles();log(`${spec.name} ${curr+1}단계 증축: ${spec.names[curr]}`,'시설');update(`${spec.name} ${curr+1}단계로 증축했습니다.`);}
function trainDisc(id){const d=findDisc(id);if(!d)return;if(d.lastTrain===S.totalMonths){note('이번 달에 이미 집중 수련했습니다.');return;}if(S.gold<35){note('수련에 필요한 35금이 부족합니다.');return;}if(d.fatigue>=90){note('제자가 지쳐 있습니다. 숙소에서 휴식을 취해야 합니다.');return;}S.gold-=35;d.lastTrain=S.totalMonths;const bonus=(.6*TALENTS[d.talent].growth*gymGrowth()*dormGrowth()*activePolicy().train);for(const key of STATS){d.stats[key]=clamp(Math.min(d.limits[key],d.stats[key]+bonus),1,99);}d.fatigue=Math.min(100,d.fatigue+13);log(d.name+' 집중 수련','수련');update(d.name+'의 능력치가 상승했습니다.');}
function equipDisc(id,manual){const d=findDisc(id);if(!d)return;if(!ownedStars(manual)){note('문파가 보유하지 않은 무공입니다.');return false;}const tier=Number(manual.split('-')[0]);if(tier>manualTierForDisc(d)){note(`${REALMS[d.realm]} 제자는 ${MANUAL_TIERS[manualTierForDisc(d)]} 등급 이하의 무공만 장착할 수 있습니다.`);return false;}d.equipped=manual;update(d.name+' 무공 장착: '+nameOfManual(manual));return true;}
function calcBreak(d){if(d.realm>=7)return {ok:false,reason:'최고 경지입니다.'};const requirement=REQ[d.realm];if(avg(d)<requirement)return {ok:false,reason:`평균 능력치 ${requirement} 이상 필요 (현재 ${avg(d).toFixed(1)})`};if(d.stats.내공<requirement)return {ok:false,reason:`내공 ${requirement} 이상 필요 (현재 ${d.stats.내공.toFixed(1)})`};if(!d.equipped||ownedStars(d.equipped)!==10)return {ok:false,reason:'문파 공용 10성 무공을 장착해야 합니다.'};const [tier]=d.equipped.split('-').map(Number);if(tier!==REALM_MANUAL[d.realm])return {ok:false,reason:`현재 경지 돌파용 ${MANUAL_TIERS[REALM_MANUAL[d.realm]]} 무공이 필요합니다.`};const price=d.realm+1;if(S.stones<price)return {ok:false,reason:`돌파 재화 ${price}개가 필요합니다.`};const innerExtra=Math.min(5,Math.floor(Math.max(0,d.stats.내공-requirement)/5));return {ok:true,chance:clamp(BASE[d.realm]+TALENTS[d.talent].break+innerExtra+gymBreak(),1,99),price};}
function breakthrough(id){const d=findDisc(id);if(!d)return;const test=calcBreak(d);if(!test.ok){note(test.reason);return;}S.stones-=test.price;const success=Math.random()*100<test.chance;if(success){d.realm++;log(d.name+' '+REALMS[d.realm]+' 돌파 성공!','돌파');}else log(d.name+' 돌파 실패. 돌파 재화만 소모했습니다.','돌파');update(d.name+' 돌파 '+(success?'성공':'실패')+' (성공률 '+test.chance+'%).');}
function drawManual(n){if(S.scrolls<n){note(`비급서 ${n}권 필요합니다.`);return;}S.scrolls-=n;let best=0;const results=[];for(let i=0;i<n;i++){const row=weightedIndex(MANUAL_RATES),col=rand(0,4),id=row+'-'+col;best=Math.max(best,row);const before=ownedStars(id);let result;if(before===0){S.manuals[id]=1;result='신규 획득 · 1성';}else if(before<10){S.manuals[id]=before+1;result='강화 · '+before+'성 → '+S.manuals[id]+'성';}else{S.gold+=20;result='최대 10성 · 20금으로 전환';}results.push({id,row,col,result});}
 log(`${n}회 비급 뽑기 완료 · 최고 ${MANUAL_TIERS[best]} 무공`,'무공');update(`${n}회 무공 뽑기 완료. 최고 ${MANUAL_TIERS[best]} 등급.`);const rows=results.map((r,i)=>`<li><strong>${i+1}. ${esc(nameOfManual(r.id))}</strong><span>${MANUAL_TIERS[r.row]} · ${CATEGORIES[r.col]} · ${esc(r.result)}</span></li>`).join('');showDialog('무공 뽑기 결과',`<p class="helper">${n}회 뽑기 완료 · 최고 등급 <strong>${MANUAL_TIERS[best]}</strong></p><ol role="list" class="draw-results" tabindex="0" aria-label="획득한 무공 ${n}건">${rows}</ol>`);}
function mission(kind){if(S.lastMission===S.totalMonths){note('한 달에 한 번만 출전할 수 있습니다.');return;}const party=S.party.map(id=>findDisc(id)).filter(Boolean).filter(d=>age(d)>=21);if(!party.length){note('전투 가능한 21세 이상 제자를 편성해야 합니다.');return;}const strength=party.reduce((s,d)=>s+avg(d)*(1-d.fatigue/150),0);const success=Math.random()<clamp(.55+(strength-90)/290,.15,.95);S.lastMission=S.totalMonths;
 party.forEach(d=>d.fatigue=clamp(d.fatigue+rand(13,26),0,100));const good=kind==='escort';if(success){const earned=(good?150:270);S.gold+=earned;if(good){S.scrolls++;S.stones+=Math.random()<.22?1:0;}S.align=clamp(S.align+(good?7:-8)*activePolicy()[good?'good':'bad'],-100,100);S.fame=clamp(S.fame+(good?5:-6)*activePolicy()[good?'good':'bad'],-100,100);log(`${good?'상단 호위':'흑도 약탈'} 성공 · ${earned}금`,'강호');}else{S.gold=Math.max(0,S.gold-60);if(Math.random()<.25){const d=party[rand(0,party.length-1)];d.injury++;}log(`${good?'상단 호위':'흑도 약탈'} 실패`,'강호');}update(success?'강호 활동 성공':'강호 활동 실패');}
function invest(name){const type=INVEST.find(t=>t.name===name);if(!type)return;if(S.buildings.money<type.level){note('재무각 단계가 부족합니다.');return;}if(S.investments.some(x=>x.name===name)){note('이미 투자 중인 사업입니다.');return;}if(S.gold<type.cost){note(`투자금 ${fmt(type.cost)}금이 필요합니다.`);return;}S.gold-=type.cost;S.investments.push({name,start:S.totalMonths,delay:type.delay});log(`${name} 투자 시작`,'투자');update(name+' 투자를 시작했습니다.');}
function craftPill(){if(S.buildings.heal<6){note('약선당 6단계에서 연단이 해금됩니다.');return;}if(S.gold<120){note('시험 연단에 120금이 필요합니다.');return;}S.gold-=120;S.pills=(S.pills||0)+1;log('약선당에서 단약 1개를 연단했습니다.','연단');update('시험 단약 1개 제작 완료.');}
function usePill(id){const d=findDisc(id);if(!d||!(S.pills>0)){note('단약이 부족합니다.');return;}if(!d.fatigue&&!d.injury){note('회복할 피로나 부상이 없습니다.');return;}S.pills--;d.fatigue=Math.max(0,d.fatigue-40);d.injury=Math.max(0,d.injury-1);update(d.name+'에게 단약을 사용했습니다.');}
function chooseHeir(id){const d=findDisc(id);if(!d||d.gen!==1)return;if(hall()<4){note('장문인전 4단계부터 후계자를 지정할 수 있습니다.');return;}S.heirId=d.id;update(d.name+'을(를) 후계자로 지정했습니다. 계승 명분 '+legitimacy(d)+'점.');}
function policyModal(){if(!S.allowPolicy){note('장문인전 5단계 이상에서 신임 장문인 취임 시 변경할 수 있습니다.');return;}showDialog('문파 기조 선택','<p class="small">기존 기조를 유지할 수도 있습니다. 6~9단계 추가 기조는 아직 미정입니다.</p><div class="choices">'+Object.entries(POLICIES).map(([k,v])=>`<button type="button" class="choice" data-dialog="policy" data-key="${k}"><strong>${v.name}${S.policy===k?' · 현재 기조':''}</strong><span>${v.desc}</span></button>`).join('')+'</div><button type="button" class="btn wide" data-dialog="deferPolicy">나중에 결정</button>');}
function setPolicy(key){if(!S.allowPolicy||!POLICIES[key])return;if(S.policy!==key){S.unrest=clamp(S.unrest+8,0,100);S.policy=key;log('문파 기조를 '+POLICIES[key].name+'으로 변경','정책');}S.allowPolicy=false;closeDialog();update('문파 기조가 결정되었습니다.');}
function calmCrisis(type){if(type==='pay'){if(S.gold<300){note('금 300이 필요합니다.');return;}S.gold-=300;S.unrest=clamp(S.unrest-35,0,100);S.crisis=false;log('내분을 협상으로 진정시켰습니다.','정치');}else{const success=Math.random()<.75;if(success){S.unrest=clamp(S.unrest-30,0,100);S.crisis=false;log('반란을 진압했습니다.','정치');}else{S.gameOver=true;S.crisis=false;log('내분으로 장문인이 축출되고 문파가 멸망했습니다.','멸망');}}update('내분 사건 처리를 완료했습니다.');}
function statBox(label,value,desc=''){return `<div class="stat"><span>${esc(label)}</span><strong>${esc(value)}</strong>${desc?`<em>${esc(desc)}</em>`:''}</div>`;}
function kv(label,value){return `<div class="keyval"><span>${esc(label)}</span><strong>${esc(value)}</strong></div>`;}
function homeHTML(){const count=S.members.length,rec=(cycleYear()<=17);const isEnd=S.gameOver;const totals=cap()*3;
 return `<section class="stats" aria-label="문파 현황">${statBox('문파원',`${count} / ${totals}명`,'장문인·장로 별도')}${statBox('장문인',`${S.leader.dynasty}대 · ${age(S.leader)}세`,S.leader.name)}${statBox('조직 불만',`${Math.round(S.unrest)} / 100`,'낮을수록 안정적')}${statBox('문파 성향',S.align>10?'백도':S.align< -10?'흑도':'중도',`${Math.round(S.align)}점`)}${statBox('문파 명성',S.fame>10?'선명':S.fame< -10?'악명':'중립',`${Math.round(S.fame)}점`)}${statBox('문파 기조',activePolicy().name,activePolicy().desc)}</section>
 <section class="card space-top"><h3>장문인 능력치</h3>${abilityBarsHTML(S.leader,'leader')}<p class="helper">능력치 최대값은 99입니다.</p></section>
 <section class="card space-top"><div class="row-between"><h3>장문인 재임 주기</h3><span class="tag ${rec?'good':'warn'}">${rec?'제자 모집 가능':'모집 중단'}</span></div>
 <p class="small">${cycleYear()}년 차 / 20년 · ${rec?'제자 모집과 수련 기간':'18~20년 차 장문인 교체 기간'}</p><div class="progress" role="progressbar" aria-label="재임 주기 진행률" aria-valuemin="0" aria-valuemax="240" aria-valuenow="${S.cycleMonths}"><span style="width:${S.cycleMonths/240*100}%"></span></div>
 <div class="btn-row space-top"><button type="button" class="btn primary" data-act="advance" data-n="1" ${isEnd?'disabled':''}>다음 달</button><button type="button" class="btn" data-act="advance" data-n="12" ${isEnd?'disabled':''}>1년 진행</button><button type="button" class="btn" data-act="advance" data-n="60" ${isEnd?'disabled':''}>5년 진행</button></div>
 ${rec?'':`<button type="button" class="btn wide accent space-top" data-act="succession" ${hall()<4||!head(1)||isEnd?'disabled':''}>후계자로 장문인 교체</button>`}
 <p class="helper">17년간 모집·수련 후 마지막 3년은 계승 기간입니다. 장문인전 4단계 미만에서 장문인이 사망하면 문파가 멸망합니다.</p></section>
 <section class="card"><h3>강호 활동</h3><p class="small">21세 이상 제자로 최대 5명을 편성합니다. 전투는 현재 간이 판정입니다.</p>
 <div class="btn-row"><button type="button" class="btn" data-act="mission" data-kind="escort" ${S.lastMission===S.totalMonths||isEnd?'disabled':''}>상단 호위</button><button type="button" class="btn" data-act="mission" data-kind="raid" ${S.lastMission===S.totalMonths||isEnd?'disabled':''}>흑도 약탈</button></div><p class="helper">전투 편성: ${S.party.map(id=>findDisc(id)).filter(Boolean).length} / 5명</p></section>
 <section class="card"><h3>최근 강호일지</h3>${S.history.slice(0,4).map(l=>`<div class="log-entry"><time>${esc(l.date)} · ${esc(l.type)}</time><p>${esc(l.text)}</p></div>`).join('')}<button type="button" class="btn wide" data-act="history">전체 기록 보기</button></section>`;
}
function abilityBarsHTML(person,key){
 if(!person?.stats)return '';
 return `<dl class="ability-list" aria-label="${esc(person.name)}의 능력치">`+STATS.map((stat,i)=>{
  const current=clamp(Number(person.stats[stat])||1,1,99);
  const potential=person.limits&&person.limits[stat]!==undefined?clamp(Number(person.limits[stat]),1,99):null;
  const currentText=current.toFixed(1);
  const caption=potential===null?`현재 ${currentText} / 99`:`현재 ${currentText} / 99, 잠재력 상한 ${potential}`;
  const barWidth=(current/99*100).toFixed(2);
  const capMark=potential===null?'':`<span class="ability-cap" style="left:${(potential/99*100).toFixed(2)}%" aria-hidden="true"></span>`;
  return `<div class="ability-row"><dt id="${key}-stat-${i}">${stat}</dt><dd><div class="ability-values"><span>${currentText} / 99</span>${potential===null?'':`<span>잠재력 ${potential}</span>`}</div><div class="ability-track" role="meter" aria-labelledby="${key}-stat-${i}" aria-valuemin="1" aria-valuemax="99" aria-valuenow="${current}" aria-valuetext="${caption}"><span class="ability-fill" style="width:${barWidth}%"></span>${capMark}</div></dd></div>`;
 }).join('')+'</dl>';
}
function discipleCard(d){const first=head(d.gen)?.id===d.id, title=titleOf(d),tal=TALENTS[d.talent];const line=Object.entries(d.stats).map(([k,v])=>`${k} ${Math.floor(v)} / ${d.limits[k]}`).join(' · ');const isHeir=S.heirId===d.id;const check=calcBreak(d);
 return `<article class="entry" aria-label="${esc(d.name)} 제자 정보"><h4>${esc(d.name)} <span class="tag ${d.talent>=5?'warn':''}">${tal.name}</span></h4>
 <p>${title} · ${age(d)}세 · ${REALMS[d.realm]} · 입문 ${Math.floor(d.joinMonth/12)+1}년 ${(d.joinMonth%12)+1}월</p>
 <div class="label-grid"><div><dt>성장 배율</dt><dd>×${tal.growth.toFixed(2)}</dd></div><div><dt>평균 능력치</dt><dd>${avg(d).toFixed(1)}</dd></div><div><dt>내공</dt><dd>${d.stats.내공.toFixed(1)}</dd></div><div><dt>피로도</dt><dd>${Math.round(d.fatigue)} / 100</dd></div></div>
 <h5 class="ability-heading">개인 능력치 <span>(막대: 현재 수치 · 표시선: 잠재력 상한)</span></h5>${abilityBarsHTML(d,'disciple-'+d.id)}<p class="helper">무공 장착: ${d.equipped?`${esc(nameOfManual(d.equipped))} ${ownedStars(d.equipped)}성`:'없음'} · 잠재력: 능력별 별도 적용</p>
 ${isHeir?`<p class="capsule">차기 장문인 후보 · 계승 명분 ${legitimacy(d)}점</p>`:''}
 <div class="btn-row"><button class="btn small-btn" type="button" data-act="train" data-id="${d.id}" ${S.gameOver?'disabled':''}>집중 수련</button><button class="btn small-btn" type="button" data-act="equipDialog" data-id="${d.id}" ${S.gameOver?'disabled':''}>무공 장착</button><button class="btn small-btn" type="button" data-act="break" data-id="${d.id}" ${!check.ok||S.gameOver?'disabled':''}>경지 돌파</button></div>
 ${check.ok?`<p class="good-text helper">돌파 가능 · 성공률 ${check.chance}% · 재화 ${check.price}개</p>`:`<p class="helper">돌파 조건: ${esc(check.reason)}</p>`}
 <div class="btn-row"><button type="button" class="btn small-btn" data-act="party" data-id="${d.id}" ${age(d)<21||S.gameOver?'disabled':''}>${S.party.includes(d.id)?'편성 해제':'전투 편성'}${age(d)<21?' (21세부터)':''}</button>${d.gen===1?`<button type="button" class="btn small-btn" data-act="heir" data-id="${d.id}" ${hall()<4||isHeir||S.gameOver?'disabled':''}>${isHeir?'후계자 지정됨':'후계자 지정'}</button>`:''}${d.injury>0?`<button type="button" class="btn small-btn" data-act="heal" data-id="${d.id}" ${S.buildings.heal<2?'disabled':''}>부상 치료 (${d.injury})</button>`:''}${(S.pills||0)>0&&(d.fatigue>0||d.injury>0)?`<button type="button" class="btn small-btn" data-act="pill" data-id="${d.id}">단약 사용</button>`:''}</div>
 </article>`;
}
function peopleHTML(){const target=recruitmentGeneration(),error=recruitBlocked(target);let output='<section class="card"><h3>제자 모집</h3><p class="small">15~28세 무협식 이름, 성장 자질 7등급. 20세 이하 전투 불가. 모집 확률은 비급각 단계로 제한됩니다.</p>';
 output+='<p class="small">제자 작명: <strong>'+(S.useLineage===null?'첫 모집 시 선택':S.useLineage?'항렬자 사용':'항렬자 미사용')+'</strong> · 항렬별 정원 '+cap()+'명</p>';
 output+='<p class="helper">비급각 '+S.buildings.books+'단계 · 초기 경지 '+REALMS[realmCap()]+'까지 / 자질 '+TALENTS[levelCap()].name+'까지</p>';
 output+='<p class="talent-guide"><strong>자질 순위 (낮음 → 높음)</strong><span>'+esc(TALENT_ORDER)+'</span></p>';
 output+='<p class="summary">이번 모집 자동 배정: <strong>'+absoluteRecruitmentGeneration()+'대 제자</strong> · '+byGen(target).length+' / '+cap()+'명</p>';
 output+='<p class="helper">항렬은 문파력 누적 20년마다 변경됩니다. 1~20년 차 1대 · 21~40년 차 2대 · 41~60년 차 3대. 장문인 교체나 이전 항렬의 나이와 무관하게 자동 배정됩니다.</p>';
 if(S.pending)output+='<button type="button" class="btn primary wide" data-act="showCandidates">이전 모집 결과 확인 ('+S.pending.count+'회)</button>';
 else{output+='<p class="helper">'+esc(error||'모집 가능 · 1회 35금 (테스트 비용)')+'</p>';
 output+='<div class="btn-row">'+[1,10,...(S.buildings.books>=6?[50]:[]),...(S.buildings.books>=8?[100]:[])].map(n=>`<button type="button" class="btn ${n===1?'primary':''} small-btn" data-act="recruit" data-count="${n}" ${error?'disabled':''}>${n}회 모집</button>`).join('')+'</div>';}
 output+='</section>';
 for(let g=1;g<=3;g++){const ds=byGen(g),origin=ds[0]?.origin??(g===target?absoluteRecruitmentGeneration():g+S.leader.dynasty-1),line=S.lineage[origin];
 output+=`<section class="card"><div class="row-between"><h3>${origin}대 제자</h3><span class="tag">${ds.length} / ${cap()}명</span></div>`;
 if(S.useLineage&&line)output+=`<p class="small">항렬자: ${esc(line.h)}(${esc(line.hanja)})</p>`;
 output+=ds.length?ds.map(discipleCard).join(''):'<p class="small">입문한 제자가 없습니다.</p>';
 output+='</section>';}
 return output;
}

function buildingEffect(id,l){if(id==='hall')return ['기본 문파 운영','대사형 제도 해금','대제자 제도 해금','장문인 승계 해금','문파 기조 변경 해금','신규 기조 해금 예정','신규 기조 해금 예정','신규 기조 해금 예정','신규 기조 해금 예정'][l-1];
 if(id==='yard')return `성장 효율 보정 (시험값 +${(l-1)*5}%)${l>=4?` · 돌파 확률 +${l-3}%p`:''}`;
 if(id==='books')return `초기 경지 ${REALMS[l>=5?2:l>=3?1:0]} · 자질 ${TALENTS[l>=7?6:l>=5?5:l>=3?4:3].name}까지${l===6||l===7?' · 50회 뽑기':l>=8?' · 100회 뽑기':''}${l===9?' · 기재 +3%p, 천재 +5%p, 영재 +7%p, 수재 +9%p':''}`;
 if(id==='money')return `월 기본 수입 상승${l>=4?' · 투자처 '+(l-3)+'종 해금':''}`;

 return '';
}

function moneyHTML(){return `<section class="card"><h3>재무각 투자</h3><p class="small">재무각 4~9단계에서 새 투자처가 순차적으로 해금됩니다. 투자는 누적되며 월별 재정에 반영됩니다.</p>${INVEST.map(t=>`<article class="entry"><div class="row-between"><h4>${t.name} 투자</h4><span class="tag">재무각 ${t.level}단계</span></div><p>${t.desc} · 시범 비용 ${fmt(t.cost)}금</p><button type="button" class="btn wide" data-act="invest" data-name="${t.name}" ${S.buildings.money<t.level||S.investments.some(i=>i.name===t.name)||S.gold<t.cost||S.gameOver?'disabled':''}>${S.investments.some(i=>i.name===t.name)?'투자 진행 중':'투자 시작'}</button></article>`).join('')}</section>`;}
function policyHTML(){return `<section class="card"><h3>문파 기조</h3>${kv('현재 운영 기조',activePolicy().name)}${kv('장문인전',`${hall()}단계`)}${kv('새 기조 변경',hall()<5?'5단계부터 해금':S.allowPolicy?'신임 장문인 취임 · 변경 가능':'다음 장문인 취임 시')}<button type="button" class="btn wide space-top" data-act="policyDialog" ${!S.allowPolicy?'disabled':''}>문파 기조 변경</button><p class="helper">6~9단계 추가 기조 4종의 명칭과 효과는 추후 결정합니다.</p></section>
 <section class="card"><h3>장문인 계승</h3>${kv('현 장문인',S.leader.name)}${kv('재임 주기',`${cycleYear()}년 차`)}${kv('승계 가능 단계',hall()>=4?'해금':'장문인전 4단계 필요')}${kv('현 후계자',findDisc(S.heirId)?.name||'미지정')}${kv('후계자 명분',findDisc(S.heirId)?`${legitimacy(findDisc(S.heirId))}점`:'—')}<button type="button" class="btn wide space-top" data-act="succession" ${hall()<4||!inBan()||!head(1)||S.gameOver?'disabled':''}>장문인 교체</button><p class="helper">3대 대사형 → 2대 대사형 → 대제자 경력이 계승 명분을 높입니다. 명분이 부족하면 내부 반발이 발생합니다.</p></section>
 ${moneyHTML()}
 <section class="card"><h3>원로·장로</h3>${S.elders.length?S.elders.slice(-20).map(e=>kv(e.role,e.name)).join(''):'<p class="small">아직 장로가 없습니다.</p>'}</section>
 <section class="card"><h3>강호일지</h3><button class="btn wide" type="button" data-act="history">전체 기록 확인</button></section>
 <details class="test-tools"><summary>테스트 도구 (개발 버전)</summary><p class="helper">시설 증축·확률·세대교체를 빠르게 확인하는 용도입니다.</p><div class="btn-row"><button type="button" class="btn" data-act="testGold">금 +20,000</button><button type="button" class="btn" data-act="testScroll">비급서 +100</button><button type="button" class="btn" data-act="testStone">돌파 재화 +50</button><button type="button" class="btn" data-act="testCycle">18년 차로 이동</button></div></details>`;}
function pageHTML(){return page==='home'?homeHTML():page==='people'?peopleHTML():page==='manual'?manualHTML():page==='buildings'?buildingsHTML():policyHTML();}
function render(){if(!S)return;$('#sectTitle').text(S.sect);$('#dateBadge').text('문파력 '+year()+'년 '+month()+'월');$('#masterBadge').text(S.leader.dynasty+'대 장문인 · '+S.leader.name);$('#goldValue').text(fmt(S.gold));$('#scrollValue').text(fmt(S.scrolls));$('#stoneValue').text(fmt(S.stones));$('#pageHeading').text({home:'문파 현황',people:'제자 관리',manual:'무공·비급',buildings:'문파 시설',govern:'정책·계승'}[page]);$('button[data-page]').each(function(){const curr=$(this).data('page')===page;if(curr)$(this).attr('aria-current','page');else $(this).removeAttr('aria-current');});let alerts='';if(S.gameOver)alerts+='<div class="notice danger" role="alert">문파가 멸망했습니다. 오른쪽 상단 메뉴에서 새 게임을 시작할 수 있습니다.</div>';if(S.crisis)alerts+='<div class="notice danger" role="alert"><strong>문파 내분 발생</strong><p>장로와 제자들이 장문인에 반발하고 있습니다.</p><div class="btn-row"><button type="button" class="btn" data-act="calm" data-kind="pay">회유 (300금)</button><button type="button" class="btn danger" data-act="calm" data-kind="force">무력 진압</button></div></div>';if(S.allowPolicy)alerts+='<div class="notice">새 장문인이 취임했습니다. 문파 기조를 변경할 수 있습니다.</div>';if(S.pending)alerts+='<div class="notice">선택하지 않은 제자 모집 결과가 있습니다. 제자 관리에서 확인하십시오.</div>';$('#globalAlerts').html(alerts);$('#pageContent').html(pageHTML());}
function switchPage(id){if(!['home','people','manual','buildings','govern'].includes(id))return;page=id;render();window.scrollTo(0,0);$('#gameMain').trigger('focus');}
function showDialog(title,html,closeable=true){focusBeforeDialog=document.activeElement;const close=closeable?'<button type="button" class="btn wide space-top" data-dialog="close">닫기</button>':'';$('#dialogPortal').html(`<div class="dialog-overlay"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><h2 id="dialogTitle" tabindex="-1">${esc(title)}</h2>${html}${close}</section></div>`);$('#gameApp').prop('inert',true);$('#dialogTitle').trigger('focus');}
function closeDialog(){if(S?.pending){note('모집 결과에서 제자를 선택하거나 포기해야 합니다.');return;}$('#dialogPortal').empty();$('#gameApp').prop('inert',false);if(focusBeforeDialog&&document.contains(focusBeforeDialog))$(focusBeforeDialog).trigger('focus');else $('#gameMain').trigger('focus');}
function forceCloseDialog(){$('#dialogPortal').empty();$('#gameApp').prop('inert',false);if(focusBeforeDialog&&document.contains(focusBeforeDialog))$(focusBeforeDialog).trigger('focus');else $('#gameMain').trigger('focus');}
function equipDialog(id){const d=findDisc(id);if(!d)return;const tier=manualTierForDisc(d),options=Object.keys(S.manuals).filter(k=>S.manuals[k]>0&&Number(k.split('-')[0])<=tier).sort();showDialog(d.name+' 무공 장착','<p class="helper">현재 경지 '+REALMS[d.realm]+' · 장착 가능 무공 '+MANUAL_TIERS[tier]+' 등급 이하만 표시됩니다.</p><div class="choices">'+(options.map(m=>`<button type="button" class="choice" data-dialog="equip" data-id="${d.id}" data-manual="${m}"><strong>${esc(nameOfManual(m))} · ${ownedStars(m)}성</strong><span>${MANUAL_TIERS[Number(m.split('-')[0])]} · ${CATEGORIES[Number(m.split('-')[1])]}</span></button>`).join('')||'<p class="helper">현재 경지에 장착 가능한 무공을 보유하지 않았습니다.</p>')+'</div>');}
function historyDialog(){showDialog('강호일지',`<p class="helper">최근 기록부터 최대 200개를 저장합니다.</p>${S.history.slice(0,120).map(l=>`<div class="log-entry"><time>${esc(l.date)} · ${esc(l.type)}</time><p>${esc(l.text)}</p></div>`).join('')}`);}
function gameMenu(){showDialog('게임 메뉴',`<div class="btn-row"><button type="button" class="btn" data-dialog="save">현재 기록 저장</button><button type="button" class="btn danger" data-dialog="restart">새 게임 시작</button></div><p class="helper">기록은 현재 브라우저에만 저장됩니다. 다른 기기와 자동 동기화되지 않습니다.</p>`);}
function welcomeMarkup(step){view=step;$('#welcome').prop('hidden',false);$('#gameApp').prop('hidden',true);let body='';
 if(step==='intro'){body=`<div class="splash"><div class="splash-mark" aria-hidden="true">江</div><p class="eyebrow">江湖結義錄</p><h2 id="welcomeTitle" tabindex="-1">강호결의록</h2><p>문파 키우기</p><p class="hint" lang="en">Chronicles of Jianghu Brotherhood</p><p>스무 살의 무인, 이름 없는 문파를 세우다.<br>제자를 기르고 무학을 전승하여 세월을 견뎌라.</p></div><div class="welcome-btns"><button type="button" class="btn primary wide" data-start="founder">새로운 강호 시작</button>${S?'<button type="button" class="btn wide" data-start="continue">강호일지 이어하기</button>':''}<p class="hint">모바일 전용 · 1턴=1개월 · 자동 저장</p></div>`;}
 else if(step==='founder'){body=`<p class="steps">1 / 2 · 초대 장문인 생성</p><h2 id="welcomeTitle" tabindex="-1">초대 장문인</h2><p class="small">시작 나이 20세 · 시작 경지 삼류</p><div class="field"><label for="founderName">장문인 이름</label><input id="founderName" value="${esc(founderDraft)}" autocomplete="off" maxlength="4" aria-describedby="founderHint"><p class="helper" id="founderHint">장문인 이름은 최대 4글자입니다.</p></div><button type="button" class="btn wide" data-start="reroll">무협식 이름 무작위 생성</button><p class="error" id="founderError" role="alert"></p><div class="welcome-btns"><button type="button" class="btn primary wide" data-start="sect">다음 · 문파 창설</button><button type="button" class="btn wide" data-start="intro">이전</button></div>`;}
 else{body=`<p class="steps">2 / 2 · 문파 창설</p><h2 id="welcomeTitle" tabindex="-1">문파 창설</h2><p class="small">초대 장문인 ${esc(founderDraft)} · 거점명 1글자는 '산파', 2글자는 '파'를 붙여 문파명을 완성합니다.</p><div class="field"><label for="placeName">문파 거점명</label><div class="sect-name-field"><input id="placeName" value="${esc(placeBase(locationDraft))}" autocomplete="off" maxlength="2" aria-describedby="placeHint placePreview"><span id="sectSuffix" aria-hidden="true">${Array.from(placeBase(locationDraft)).length===1?'산파':'파'}</span></div><p class="helper" id="placeHint">1글자: 화 → 화산파 · 2글자: 금오 → 금오파</p></div><p class="summary" id="placePreview" role="status" aria-live="polite" aria-atomic="true">문파 이름: ${esc(sectTitle(locationDraft))}</p><div class="field"><label for="firstPolicy">초기 문파 기조</label><select id="firstPolicy">${Object.entries(POLICIES).map(([k,v])=>`<option value="${k}" ${k===policyDraft?'selected':''}>${v.name}</option>`).join('')}</select></div><p class="helper">기조별 세부 수치는 테스트용입니다. 장문인전 5단계부터 세대교체 시 변경할 수 있습니다.</p><p class="error" id="placeError" role="alert"></p><div class="welcome-btns"><button type="button" class="btn primary wide" data-start="play">문파 창설 · 게임 시작</button><button type="button" class="btn wide" data-start="founder">이전</button></div>`;}
 $('#welcome').html('<div class="welcome-inner">'+body+'</div>');$('#welcomeTitle').trigger('focus');}
function startGame(){forceCloseDialog();$('#welcome').prop('hidden',true).empty();$('#gameApp').prop('hidden',false).prop('inert',false);page='home';render();$('#gameMain').trigger('focus');}
$(function(){load();founderDraft=randNameFake();welcomeMarkup('intro');
 function onStart(key){if(key==='intro'){welcomeMarkup('intro');return;}if(key==='continue'){if(!S){note('저장된 기록이 없습니다.');return;}startGame();return;}if(key==='founder'){welcomeMarkup('founder');return;}if(key==='reroll'){founderDraft=randNameFake();$('#founderName').val(founderDraft);note('무협식 이름을 변경했습니다.');return;}
 if(key==='sect'){const s=$.trim($('#founderName').val());if(!s){$('#founderError').text('장문인 이름을 입력하세요.');$('#founderName').trigger('focus');return;}if(Array.from(s).length>4){$('#founderError').text('장문인 이름은 최대 4글자까지 가능합니다.');$('#founderName').trigger('focus');return;}founderDraft=s;welcomeMarkup('sect');return;}
 if(key==='play'){const s=placeBase($('#placeName').val());if(Array.from(s).length<1||Array.from(s).length>2){$('#placeError').text('거점명은 1~2글자로 입력하세요.');$('#placeName').trigger('focus');return;}locationDraft=s;policyDraft=$('#firstPolicy').val();makeNew(founderDraft,locationDraft,policyDraft);startGame();note('문파 창설이 완료되었습니다.');}}
 $('#welcome').on('click','[data-start]',function(){onStart($(this).attr('data-start'));});
 $('#welcome').on('input','#placeName',function(){const v=placeBase($(this).val());$('#sectSuffix').text(Array.from(v).length===1?'산파':'파');$('#placePreview').text(v?'문파 이름: '+sectTitle(v):'거점명을 입력하세요');$('#placeError').text('');});
 $('#welcome').on('keydown','#founderName,#placeName',function(ev){if(ev.key==='Enter'){ev.preventDefault();onStart($(this).attr('id')==='founderName'?'sect':'play');}});
 $('nav.bottom-nav').on('click','[data-page]',function(){switchPage($(this).attr('data-page'));});
 $('#gameMenuBtn').on('click',gameMenu);
 $('#gameApp').on('click','[data-act]',function(){const btn=$(this);const act=btn.attr('data-act'),id=btn.attr('data-id'),n=Number(btn.attr('data-n'));if(act==='advance')advance(n);else if(act==='recruit')startRecruit(Number(btn.attr('data-count')));else if(act==='showCandidates')showCandidates();else if(act==='upgrade')upgrade(id);else if(act==='train')trainDisc(id);else if(act==='equipDialog')equipDialog(id);else if(act==='break')breakthrough(id);else if(act==='heir')chooseHeir(id);else if(act==='drawManual')drawManual(n);else if(act==='succession'){if(succession(false)){update('장문인 교체 성공');}else{update('장문인 세대교체를 처리했습니다.');if(S.allowPolicy)policyModal();}}else if(act==='party'){const d=findDisc(id);if(!d||age(d)<21)return;if(S.party.includes(d.id))S.party=S.party.filter(x=>x!==d.id);else if(S.party.length<5)S.party.push(d.id);else{note('편성은 최대 5명입니다.');return;}update('전투 편성을 변경했습니다.');}else if(act==='heal'){const d=findDisc(id);if(!d||S.buildings.heal<2||S.gold<40){note('치료 시설 또는 40금이 부족합니다.');return;}S.gold-=40;d.injury=Math.max(0,d.injury-1);update('부상을 치료했습니다.');}else if(act==='mission')mission(btn.attr('data-kind'));else if(act==='alchemy')craftPill();else if(act==='pill')usePill(id);else if(act==='invest')invest(btn.attr('data-name'));else if(act==='policyDialog')policyModal();else if(act==='calm')calmCrisis(btn.attr('data-kind'));else if(act==='history')historyDialog();else if(act==='testGold'){S.gold+=20000;update('테스트 금 20,000 지급');}else if(act==='testScroll'){S.scrolls+=100;update('비급서 100권 지급');}else if(act==='testStone'){S.stones+=50;update('돌파 재화 50개 지급');}else if(act==='testCycle'){if(S.cycleMonths<204)advance(204-S.cycleMonths);else note('이미 계승 준비 기간입니다.');}});
 $('#dialogPortal').on('click','[data-dialog]',function(){const btn=$(this),act=btn.attr('data-dialog');if(act==='close'){closeDialog();return;}if(act==='lineageConfirm'){S.useLineage=$('#lineageSelect').val()==='yes';forceCloseDialog();save();startRecruit(Number(btn.attr('data-count')));return;}if(act==='admit'){admit(btn.attr('data-id'));return;}if(act==='discard'){S.pending=null;save();forceCloseDialog();update('제자 모집 결과를 포기했습니다.');return;}if(act==='equip'){if(equipDisc(btn.attr('data-id'),btn.attr('data-manual')))forceCloseDialog();return;}if(act==='policy'){setPolicy(btn.attr('data-key'));return;}if(act==='deferPolicy'){forceCloseDialog();note('기조 선택을 보류했습니다. 운영 메뉴에서 변경할 수 있습니다.');return;}if(act==='save'){save();forceCloseDialog();note('강호일지 저장 완료');return;}if(act==='restart'){forceCloseDialog();S=null;try{localStorage.removeItem(KEY);}catch(e){}founderDraft=randNameFake();welcomeMarkup('intro');return;}});
 $('#dialogPortal').on('keydown',function(ev){if(ev.key==='Escape'){if(!S?.pending)closeDialog();return;}if(ev.key!=='Tab')return;const items=$('#dialogPortal').find('button:not([disabled]),input:not([disabled]),select:not([disabled]),[tabindex="0"]').filter(':visible');if(!items.length)return;const first=items[0],last=items[items.length-1];if(ev.shiftKey&&document.activeElement===first){ev.preventDefault();last.focus();}else if(!ev.shiftKey&&document.activeElement===last){ev.preventDefault();first.focus();}});
});
function randNameFake(){const s=[...SINGLE,...DOUBLE][rand(0,SINGLE.length+DOUBLE.length-1)];return s+MURIM[rand(0,MURIM.length-1)]+(s.length===1?MURIM[rand(0,MURIM.length-1)]:'');}
})(jQuery);
</script>
</head>
<body>
<a class="skip" href="#gameMain">본문 바로가기</a>
<div class="phone" id="gameApp" hidden>
  <header class="app-head">
    <div class="head-top"><div><p class="eyebrow">江湖結義錄 <span>· MOBILE v0.4.1</span></p><h1 id="sectTitle">강호결의록</h1></div><button type="button" class="mini-btn" id="gameMenuBtn" aria-label="게임 메뉴 열기">☰ 메뉴</button></div>
    <div class="head-info"><span id="dateBadge">창설 1년 · 1월</span><span id="masterBadge">초대 장문인</span></div>
    <div class="wallet" aria-label="보유 재화"><span>금 <strong id="goldValue">0</strong></span><span>비급서 <strong id="scrollValue">0</strong></span><span>돌파 재화 <strong id="stoneValue">0</strong></span></div>
  </header>
  <main id="gameMain" tabindex="-1">
    <div id="globalAlerts"></div>
    <h2 id="pageHeading">문파 현황</h2>
    <div id="pageContent"></div>
  </main>
  <nav class="bottom-nav" aria-label="게임 주요 메뉴">
    <button type="button" data-page="home" class="nav-item" aria-current="page"><span aria-hidden="true">⌂</span>문파</button>
    <button type="button" data-page="people" class="nav-item"><span aria-hidden="true">人</span>제자</button>
    <button type="button" data-page="manual" class="nav-item"><span aria-hidden="true">武</span>무공</button>
    <button type="button" data-page="buildings" class="nav-item"><span aria-hidden="true">閣</span>시설</button>
    <button type="button" data-page="govern" class="nav-item"><span aria-hidden="true">策</span>운영</button>
  </nav>
</div>
<div id="welcome" class="welcome"></div>
<div id="dialogPortal"></div>
<div id="announce" role="status" aria-live="polite" aria-atomic="true" class="sr-only"></div>
</body>
